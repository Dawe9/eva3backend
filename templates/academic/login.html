{% extends 'academic/base.html' %}
{% block title %}Acceso del equipo | Dulce Arte{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 520px">
    <div class="bg-white rounded shadow-sm p-4">
        <p class="text-uppercase small text-success fw-semibold">Dulce Arte · Operaciones</p>
        <h1 class="h3">Acceso del equipo</h1>
        <p class="text-secondary">Ingresa con tu cuenta autorizada para administrar pedidos y producción.</p>
        <form id="login-form">
            <label class="form-label mt-3" for="username">Usuario</label>
            <input class="form-control" id="username" required autocomplete="username">
            <label class="form-label mt-3" for="password">Contrasena</label>
            <input class="form-control" id="password" type="password" required autocomplete="current-password">
            <button class="btn btn-success w-100 mt-4" type="submit">Ingresar al panel</button>
            <p id="login-status" class="mt-3 mb-0" role="status"></p>
        </form>
    </div>
</div>
<script>
document.querySelector('#login-form').addEventListener('submit', async event => {
    event.preventDefault();
    const status = document.querySelector('#login-status');
    const response = await fetch('/api/token/', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
        username: document.querySelector('#username').value,
        password: document.querySelector('#password').value
    })});
    if (!response.ok) { status.className = 'text-danger'; status.textContent = 'Usuario o contraseña incorrectos.'; return; }
    const tokens = await response.json();
    const claims = getTokenClaims(tokens.access);
    if (getTokenRole(tokens.access) !== 'gestor_bodega' && !claims?.is_superuser) {
        sessionStorage.removeItem('nexo-access-token');
        sessionStorage.removeItem('nexo-refresh-token');
        status.className = 'text-danger';
        status.textContent = 'Esta plataforma es solo para el equipo autorizado de Dulce Arte.';
        return;
    }
    sessionStorage.setItem('nexo-access-token', tokens.access);
    sessionStorage.setItem('nexo-refresh-token', tokens.refresh);
    sessionStorage.setItem('nexo-cart', JSON.stringify([]));

    const nextPage = new URLSearchParams(window.location.search).get('next');
    window.location.href = nextPage && nextPage.startsWith('/') ? nextPage : '/';
});
</script>
{% endblock %}
