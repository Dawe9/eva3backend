{% extends 'academic/base.html' %}
{% block title %}Solicitud de Abastecimiento | Farmacia B2B{% endblock %}
{% block content %}
<section class="py-4 py-lg-5">
<style>
    .cart-shell { max-width: 1280px; margin: 0 auto; }
    .cart-page-title { font-size: clamp(2rem, 2.3vw, 3rem); font-weight: 800; margin: 0; }
    .cart-page-header { display: flex; align-items: center; gap: .75rem; }
    .cart-page-icon { width: 2.2rem; height: 2.2rem; display: inline-flex; align-items: center; justify-content: center; background: #edf6ee; color: var(--pine); border-radius: 12px; }
    .cart-page-icon svg { width: 1.2rem; height: 1.2rem; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .cart-layout { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(300px, .9fr); gap: 2rem; align-items: start; }
    .cart-list { background: #fff; border: 1px solid #e7e9e4; border-radius: 0; padding: 0; overflow: hidden; }
    .cart-item { display: grid; grid-template-columns: 86px minmax(0, 1fr) auto auto; gap: 1rem; align-items: center; padding: 1.25rem 1.4rem; border-bottom: 1px solid #edf0eb; }
    .cart-item:last-child { border-bottom: none; }
    .cart-product-thumb { width: 76px; height: 76px; border-radius: 10px; background: linear-gradient(135deg, #f2f4ef, #dfe7df); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0f5132; font-size: .72rem; text-transform: uppercase; overflow: hidden; }
    .cart-product-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-meta { min-width: 0; }
    .cart-item-brand { color: #2d5b4c; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
    .cart-item-name { margin: .25rem 0 .2rem; font-size: 1.05rem; font-weight: 700; }
    .cart-item-details { color: #5a645f; font-size: .82rem; }
    .cart-item-controls { display: flex; align-items: center; gap: .6rem; }
    .cart-item-qty { width: 86px; }
    .cart-item-price { min-width: 120px; text-align: right; font-size: 1.05rem; font-weight: 700; color: #0f172a; }
    .cart-item-actions { display: flex; align-items: center; gap: .5rem; }
    .cart-summary { background: #fff; border: 1px solid #e7e9e4; padding: 1.6rem 1.4rem; }
    .summary-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; font-size: .96rem; }
    .summary-row strong { font-size: 1.05rem; }
    .summary-total { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #dfe7df; padding-top: 1.1rem; margin-top: 1rem; font-weight: 800; font-size: 1.6rem; }
    .btn-primary-buy { background: linear-gradient(90deg, #f3c15d, #f59b26); border: none; color: #0f172a; font-weight: 800; letter-spacing: .04em; padding: .9rem 1rem; width: 100%; border-radius: 0.8rem; margin-top: 1.2rem; }
    .promo-inline { display: flex; gap: .6rem; margin: 1rem 0 1.3rem; }
    .promo-inline input { flex: 1; }
    .promo-inline button { min-width: 120px; }
    .summary-label { color: #44514c; }
    @media (max-width: 991.98px) { .cart-layout { grid-template-columns: 1fr; } }
    @media (max-width: 575.98px) { .cart-item { grid-template-columns: 70px minmax(0, 1fr); } .cart-item-price, .cart-item-controls, .cart-item-actions { grid-column: 2; justify-self: start; } .cart-item-actions { margin-top: .25rem; } }
</style>
<div class="container cart-shell">
    <div class="catalog-crumb pt-4">Inicio <span class="mx-2">/</span> Carrito</div>
    <div class="d-flex justify-content-between align-items-center my-4">
        <div class="cart-page-header">
            <span class="cart-page-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="19" r="1.5"></circle>
                    <circle cx="17" cy="19" r="1.5"></circle>
                    <path d="M3 4h2l2.4 9.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L19 7H7"></path>
                </svg>
            </span>
            <h1 class="cart-page-title">Carro de compras <span id="cart-count-inline" class="text-secondary">(0 productos)</span></h1>
        </div>
    </div>
    <div class="cart-layout pb-5">
        <div id="cart-items" class="cart-list"></div>
        <aside class="cart-summary">
            <h2 class="h4 mb-3">Resumen de compra</h2>
            <div class="summary-row"><span class="summary-label">Subtotal</span><strong id="subtotal-price">$0</strong></div>
            <div class="summary-row"><span class="summary-label">Despacho</span><strong>$0</strong></div>
            <div class="summary-total"><span>TOTAL</span><span id="cart-total">$0</span></div>
            <button type="button" class="btn btn-primary-buy" id="checkout-button">IR A PAGAR</button>
        </aside>
    </div>
</div>
<script>
const money = value => `$${Number(value).toLocaleString('es-CL')}`;
let cart = [];

async function syncCartWithServer() {
    const token = localStorage.getItem('nexo-access-token');
    if (!token) return;
    try {
        const response = await fetch('/api/carro-insumos/', { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) return;
        const payload = await response.json();
        cart = payload.items || [];
        localStorage.setItem('nexo-cart', JSON.stringify(cart));
    } catch (error) {
        console.warn('No se pudo sincronizar el carrito del servidor:', error);
    }
}

function renderCart() {
    const total = cart.reduce((sum, item) => sum + Number(item.unit_price) * item.quantity, 0);
    document.querySelector('#cart-total').textContent = money(total);
    document.querySelector('#subtotal-price').textContent = money(total);
    document.querySelector('#cart-count-inline').textContent = `(${cart.length} ${cart.length === 1 ? 'producto' : 'productos'})`;
    const cartCount = document.querySelector('#cart-count');
    if (cartCount) cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

    const target = document.querySelector('#cart-items');
    if (!target) return;

    target.innerHTML = cart.length ? cart.map((item, index) => `
        <div class="cart-item">
            <div class="cart-product-thumb">
                ${item.image_url ? `<img src="${item.image_url}" alt="${item.supply_name}">` : '<span>+</span>'}
            </div>
            <div class="cart-item-meta">
                <div class="cart-item-brand">${item.category_name || 'GENERICO'}</div>
                <div class="cart-item-name">${item.supply_name}</div>
                <div class="cart-item-details">${item.quantity} ${item.quantity === 1 ? 'caja' : 'cajas'} · Lote ${item.lot} · SKU ${item.supply}</div>
            </div>
            <div class="cart-item-controls">
                <input class="form-control cart-item-qty" aria-label="Cantidad de cajas" type="number" min="1" value="${item.quantity}" onchange="changeQuantity(${index}, this.value)">
            </div>
            <div class="cart-item-actions">
                <div class="cart-item-price">${money(Number(item.unit_price) * item.quantity)}</div>
                <button class="btn btn-link text-danger p-0 ms-2" onclick="removeItem(${index})">Eliminar</button>
            </div>
        </div>
    `).join('') : '<div class="p-4 text-secondary">Tu carrito está vacío. <a href="/products/">Explora el catálogo.</a></div>';

    const button = document.querySelector('#checkout-button');
    if (button) button.disabled = !cart.length;
}

async function changeQuantity(index, quantity) {
    const token = localStorage.getItem('nexo-access-token');
    const item = cart[index];
    if (!token || !item) return;
    const nextQty = Math.max(1, Number(quantity) || 1);
    const response = await fetch('/api/carro-insumos/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ supply_id: item.supply, quantity: nextQty, increment: false })
    });
    if (response.ok) {
        cart = (await response.json()).items;
        localStorage.setItem('nexo-cart', JSON.stringify(cart));
        renderCart();
    }
}

async function removeItem(index) {
    const token = localStorage.getItem('nexo-access-token');
    const item = cart[index];
    if (!token || !item) return;
    const response = await fetch(`/api/carro-insumos/?supply_id=${item.supply}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` }
    });
    if (response.ok) {
        cart = cart.filter(entry => entry.supply !== item.supply);
        localStorage.setItem('nexo-cart', JSON.stringify(cart));
        renderCart();
    }
}

document.querySelector('#checkout-button')?.addEventListener('click', async () => {
    const token = localStorage.getItem('nexo-access-token');
    if (!token) {
        window.location.href = '/login/?next=/cart/';
        return;
    }
    const response = await fetch('/api/solicitudes/confirmar/', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` }
    });
    if (!response.ok) {
        alert('No se pudo confirmar la solicitud. Verifica el stock y tu perfil institucional.');
        return;
    }
    const order = await response.json();
    cart = [];
    localStorage.setItem('nexo-cart', JSON.stringify(cart));
    renderCart();
    alert(`Solicitud #${order.id} creada y confirmada correctamente.`);
});

syncCartWithServer().finally(() => renderCart());
</script>
</section>
{% endblock %}
